services:
  mysql:
    image: mysql:8.0
    container_name: presence_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Consommees uniquement par database/03-privileges.sh (creation de
      # l'utilisateur restreint a db_attestations) -- jamais lues par le backend.
      MYSQL_ATTESTATIONS_USER: ${MYSQL_ATTESTATIONS_USER}
      MYSQL_ATTESTATIONS_PASSWORD: ${MYSQL_ATTESTATIONS_PASSWORD}
      MYSQL_RGPD_USER: ${MYSQL_RGPD_USER}
      MYSQL_RGPD_PASSWORD: ${MYSQL_RGPD_PASSWORD}
    # Aucun port publie vers l'hote : conformement a l'architecture de deploiement
    # (chap. 4.3), MySQL n'est accessible que via le reseau Docker interne, jamais
    # depuis l'exterieur du conteneur hote. Seul le proxy Caddy est expose (ports 80/443).
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts executes automatiquement (une seule fois, au premier demarrage
      # du volume) par l'entrypoint officiel MySQL, dans l'ordre alphabetique :
      # 01-schema.sql -> 02-seed.sql -> 03-privileges.sh. Monte en lecture
      # seule : ce conteneur ne doit jamais pouvoir modifier ces scripts.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - presence_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presence_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      # Consommees par backend/src/config/db.js (pool mysql2/promise) depuis
      # l'Etape 1 -- le backend se connecte desormais reellement a db_logs.
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Identite dediee a la cloture RGPD (Etape 9). Pool SEPARE : seul le
      # controleur de cloture l'emprunte, pour que l'application ordinaire
      # reste incapable de modifier la table scans.
      MYSQL_RGPD_USER: ${MYSQL_RGPD_USER}
      MYSQL_RGPD_PASSWORD: ${MYSQL_RGPD_PASSWORD}
      # FIX (post Etape 2) : ces deux variables manquaient ici. Sans elles,
      # tokenService.js retombe sur un chemin de secours calcule depuis
      # __dirname (/app/src/services), qui remonte a la racine du systeme de
      # fichiers du conteneur (/keys/private.pem) plutot qu'a /app/keys ou le
      # volume ci-dessous monte reellement la cle -- le backend plantait au
      # demarrage (ENOENT) des que la variable n'etait pas deja presente par
      # ailleurs. Valeur de secours (${...:-...}) alignee sur .env.example :
      # si jamais un .env incomplet omet ces variables, docker compose
      # injecte quand meme un chemin correct plutot qu'une chaine vide.
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-./keys/private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-./keys/public.pem}
    volumes:
      # Cle privee RS256, montee en LECTURE SEULE : necessaire depuis l'Etape 2
      # (tokenService.js la lit pour signer les jetons de seance). Sans ce
      # volume, le backend planterait au demarrage (fail-fast volontaire de
      # tokenService.js, cf. backend/src/services/tokenService.js) faute de
      # pouvoir lire /app/keys/private.pem. Jamais montee en ecriture : le
      # conteneur backend n'a aucune raison de modifier la cle.
      - ./keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
    # Aucun port publie vers l'hote : le backend n'est joignable que par Caddy,
    # via le reseau Docker interne (nom de service "backend", port 3000).
    networks:
      - presence_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: presence_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
    volumes:
      # Montage du code source pour le rechargement a chaud (HMR) -- a la
      # difference du backend (jamais monte, cf. plus haut), le frontend est
      # ICI en mode developpement actif : Vite doit voir chaque modification
      # de ./frontend sur l'hote immediatement, sans reconstruire l'image.
      - ./frontend:/app
      # Volume anonyme SUR /app/node_modules : empeche le montage
      # ci-dessus d'ECRASER le node_modules installe PAR le conteneur
      # (RUN npm install du Dockerfile) avec un eventuel node_modules de
      # l'hote (absent, different d'OS, ou simplement pas installe cote
      # Windows) -- meme principe que .dockerignore pour le backend, mais
      # necessaire ICI en plus car le bind mount, contrairement a COPY,
      # s'applique en continu et masquerait sinon le contenu du conteneur
      # a chaque demarrage.
      - /app/node_modules
    # Aucun port publie vers l'hote : comme backend et mysql, le frontend
    # n'est joignable que via Caddy (reseau Docker interne, port 5173).
    # C'est egalement VITAL pour l'API WebCrypto (Etape 4) : elle exige un
    # contexte securise (HTTPS OU localhost) -- passer exclusivement par
    # Caddy garantit que le prototype est toujours teste dans les conditions
    # reelles (HTTPS via reverse proxy), jamais via un acces direct qui
    # masquerait un probleme de configuration TLS.
    networks:
      - presence_net

  proxy:
    image: caddy:2-alpine
    container_name: presence_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - presence_net

networks:
  presence_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
