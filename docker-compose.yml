services:
  mysql:
    image: mysql:8.0
    container_name: presence_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Consommees uniquement par database/03-privileges.sh (creation de
      # l'utilisateur restreint a db_attestations) -- jamais lues par le backend.
      MYSQL_ATTESTATIONS_USER: ${MYSQL_ATTESTATIONS_USER}
      MYSQL_ATTESTATIONS_PASSWORD: ${MYSQL_ATTESTATIONS_PASSWORD}
    # Aucun port publie vers l'hote : conformement a l'architecture de deploiement
    # (chap. 4.3), MySQL n'est accessible que via le reseau Docker interne, jamais
    # depuis l'exterieur du conteneur hote. Seul le proxy Caddy est expose (ports 80/443).
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts executes automatiquement (une seule fois, au premier demarrage
      # du volume) par l'entrypoint officiel MySQL, dans l'ordre alphabetique :
      # 01-schema.sql -> 02-seed.sql -> 03-privileges.sh. Monte en lecture
      # seule : ce conteneur ne doit jamais pouvoir modifier ces scripts.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - presence_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presence_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      # Consommees par backend/src/config/db.js (pool mysql2/promise) depuis
      # l'Etape 1 -- le backend se connecte desormais reellement a db_logs.
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    # Aucun port publie vers l'hote : le backend n'est joignable que par Caddy,
    # via le reseau Docker interne (nom de service "backend", port 3000).
    networks:
      - presence_net

  proxy:
    image: caddy:2-alpine
    container_name: presence_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - presence_net

networks:
  presence_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
